<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: iPhone-ийн "notch" болон доод зурвас хүртэл дэлгэц дүүргэнэ -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Solongoa</title>
  <style>
    :root {
      --bg: #000;
      --accent: #ff4d6d;
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.6);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;           /* iPhone Safari-ийн хаягийн мөрөнд зөв тохирно */
      display: block;
      transform-origin: center;
    }
    canvas.beat { animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.025); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.02); }
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 45%, rgba(255, 77, 109, 0.18), transparent 60%), var(--bg);
      transition: opacity 0.6s ease, visibility 0.6s;
      z-index: 10;
    }
    .overlay.hide { opacity: 0; visibility: hidden; }

    .card { text-align: center; max-width: 340px; }
    .icon {
      font-size: 64px;
      line-height: 1;
      color: var(--accent);
      animation: beat 1.4s ease-in-out infinite;
      text-shadow: 0 0 24px rgba(255, 77, 109, 0.7);
    }
    h1 {
      margin: 18px 0 8px;
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ff4d6d, #ffb703, #06d6a0, #4cc9f0, #c77dff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .card p {
      margin: 0 0 28px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .primary {
      min-height: 52px;
      padding: 0 32px;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 8px 28px rgba(255, 77, 109, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .primary:active { transform: scale(0.96); }

    /* ---------- Доод удирдлагын хэсэг ---------- */
    .controls {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 6px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      z-index: 5;
      transition: opacity 0.4s ease;
    }
    .controls[hidden] { display: flex; opacity: 0; pointer-events: none; }

    .ctrl {
      min-width: 44px;           
      min-height: 44px;
      padding: 0 18px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .ctrl:hover { background: rgba(255, 255, 255, 0.1); }
    .ctrl:active { transform: scale(0.94); }
    .ctrl.icon-only { padding: 0; width: 44px; font-size: 18px; }

    @media (prefers-reduced-motion: reduce) {
      canvas.beat, .icon { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Өнгөт шугамаар зурсан зүрх"></canvas>

  <div id="intro" class="overlay">
    <div class="card">
      <div class="icon">♥</div>
      <h1>Solongohon</h1>
      <p>Та бэлэн үү?</p>
      <button id="startBtn" class="primary">▶&nbsp; бэлэн</button>
    </div>
  </div>

  <nav id="controls" class="controls" hidden>
    <button id="replay" class="ctrl">↻&nbsp; Again</button>
    <button id="sound" class="ctrl icon-only" aria-label="Дуу унтраах">🔊</button>
  </nav>

  <script>
    
    const CONFIG = {
      audioSrc: "song.mp3",   
      audioStart: 0,          
      audioDuration: 8.5,       
      drawMs: 6500,           
    };
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const intro = document.getElementById("intro");
    const controls = document.getElementById("controls");
    const soundBtn = document.getElementById("sound");
    const colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"];
    const N = 120;
    const SCALE = 15;
    let W = 0, H = 0, unit = 1, cx = 0, cy = 0;
    let lines = [];
    let drawn = 0;
    let startTime = 0;
    let rafId = null;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Зүрх ойролцоогоор 500 x 470 нэгж. Доод товчны зай үлдээнэ.
      const bottomSpace = 90;
      const topSpace = 40;
      unit = Math.min((W - 32) / 500, (H - bottomSpace - topSpace) / 470);
      cx = W / 2;
      cy = topSpace + (H - bottomSpace - topSpace) / 2;
      redrawAll();
    }
    function toScreen(x, y) {
      return [cx + x * unit, cy - (y + 37) * unit];
    }
    // ---------- Шугамуудыг урьдчилан тооцоолох ----------
    function makeLines() {
      lines = [];
      for (let k = 0; k < N; k++) {
        const a = k * (Math.PI * 2) / N;
        const x = 16 * Math.pow(Math.sin(a), 3) * SCALE;
        const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a)
                 - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * SCALE;
        lines.push({ x, y, c: colors[Math.floor(Math.random() * colors.length)] });
      }
    }

    function clear() {
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
    }

    function drawLine(l) {
      const [sx, sy] = toScreen(0, 40);
      const [ex, ey] = toScreen(l.x, l.y);

      ctx.strokeStyle = l.c;
      ctx.shadowColor = l.c;           // Гэрэлтэх эффект
      ctx.shadowBlur = 6 * unit;
      ctx.lineWidth = Math.max(1, unit);
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // 8 цацрагтай од
      const r = 6 * unit;
      ctx.beginPath();
      for (let j = 0; j < 8; j++) {
        const ang = j * Math.PI / 4;
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex + r * Math.cos(ang), ey + r * Math.sin(ang));
      }
      ctx.stroke();
    }

    function redrawAll() {
      clear();
      for (let k = 0; k < drawn; k++) drawLine(lines[k]);
    }

    // ---------- Хөдөлгөөн ----------
    function loop(now) {
      const target = Math.min(N, Math.floor((now - startTime) / CONFIG.drawMs * N) + 1);
      while (drawn < target) drawLine(lines[drawn++]);

      if (drawn < N) {
        rafId = requestAnimationFrame(loop);
      } else {
        canvas.classList.add("beat");   // Дуусахад зүрх цохилно
      }
    }

    function startDrawing() {
      cancelAnimationFrame(rafId);
      canvas.classList.remove("beat");
      makeLines();
      drawn = 0;
      clear();
      startTime = performance.now();
      rafId = requestAnimationFrame(loop);
    }

    // ---------- Дуу ----------
    const audio = new Audio(CONFIG.audioSrc);
    audio.preload = "auto";
    let actx = null, gain = null, stopTimer = null, pauseTimer = null;

    // iPhone дээр audio.volume ажилладаггүй тул Web Audio-гаар fade хийнэ
    function setupAudioGraph() {
      if (actx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        actx = new AC();
        const src = actx.createMediaElementSource(audio);
        gain = actx.createGain();
        src.connect(gain).connect(actx.destination);
      } catch (e) { actx = null; gain = null; }
    }

    function fade(to, seconds) {
      if (!gain) return;
      const t = actx.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(gain.gain.value, t);
      gain.gain.linearRampToValueAtTime(to, t + seconds);
    }

    function playClip() {
      setupAudioGraph();
      if (actx && actx.state === "suspended") actx.resume();
      clearTimeout(stopTimer);
      clearTimeout(pauseTimer);

      const seek = () => { try { audio.currentTime = CONFIG.audioStart; } catch (e) {} };
      if (audio.readyState >= 1) seek();
      else audio.addEventListener("loadedmetadata", seek, { once: true });

      if (gain) gain.gain.value = 0;
      audio.play().then(() => fade(1, 1)).catch(() => {});   // mp3 байхгүй бол чимээгүй үргэлжилнэ

      stopTimer = setTimeout(() => {
        fade(0, 1);
        pauseTimer = setTimeout(() => audio.pause(), 1100);
      }, (CONFIG.audioDuration - 1) * 1000);
    }

    // ---------- Товчнууд ----------
    function start() {
      playClip();          // iPhone: дуу заавал товч дарсан үед эхлэх ёстой
      startDrawing();
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      intro.classList.add("hide");
      controls.hidden = false;
      start();
    });

    document.getElementById("replay").addEventListener("click", start);

    soundBtn.addEventListener("click", () => {
      audio.muted = !audio.muted;
      soundBtn.textContent = audio.muted ? "🔇" : "🔊";
      soundBtn.setAttribute("aria-label", audio.muted ? "Дуу асаах" : "Дуу унтраах");
    });

    // Хэмжээ өөрчлөгдөхөд дахин эхлэхгүй, зурсныг нь л дахин зурна
    // (iPhone-ийн хаягийн мөр нуугдах үед зураг алга болохоос сэргийлнэ)
    let resizeQueued = false;
    window.addEventListener("resize", () => {
      if (resizeQueued) return;
      resizeQueued = true;
      requestAnimationFrame(() => { resizeQueued = false; resize(); });
    });

    makeLines();
    resize();
  </script>
</body>
</html>
